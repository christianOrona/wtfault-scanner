[package]
name = "aim-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aim-protocols = { version = "0.4.0", path = "../protocols" }
aim-transport = { version = "0.4.0", path = "../transport", default-features = false }
aim-types = { version = "0.4.0", path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"

[features]
default = ["serial"]
# Real serial / Bluetooth-COM transport, and therefore COM-port probing.
serial = ["aim-transport/serial"]

[dev-dependencies]
aim-simulator = { path = "../../simulator" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The hardware probe talks to a real COM port, so it cannot build without the
# serial transport. Declaring that here is what lets
# `--all-targets --no-default-features` skip it instead of failing on it.
[[example]]
name = "probe_port"
required-features = ["serial"]

# Same again: both of these open a real COM port to ask a real adapter what it
# supports, so neither can build without the serial transport.
[[example]]
name = "ask_adapter"
required-features = ["serial"]

[[example]]
name = "restore_bus"
required-features = ["serial"]
