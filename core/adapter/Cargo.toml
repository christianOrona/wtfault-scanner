[package]
name = "aim-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aim-protocols = { version = "0.1.0", path = "../protocols" }
aim-transport = { version = "0.1.0", path = "../transport", default-features = false }
aim-types = { version = "0.1.0", path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"

[features]
default = ["serial"]
# Real serial / Bluetooth-COM transport, and therefore COM-port probing.
serial = ["aim-transport/serial"]

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
