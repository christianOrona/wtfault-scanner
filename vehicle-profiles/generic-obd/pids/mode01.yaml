      1: "Open loop, engine not yet at operating temperature"
      2: "Closed loop, using oxygen sensor feedback"
      4: "Open loop due to engine load or fuel cut"
      8: "Open loop due to system fault"
      16: "Closed loop with fault in at least one oxygen sensor"

