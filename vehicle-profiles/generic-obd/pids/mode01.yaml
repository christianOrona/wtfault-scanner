# SAE J1979 service 01 (current data) PID definitions.
#
# Byte names follow the SAE convention: A is the first payload byte after the
# echoed PID, B the second, and so on.
version: 7
source: "SAE J1979 generic OBD-II service 01"
service: 1
pids:
  - pid: 0x00
    signal_id: supported_pids_01_20
    name: "PIDs supported [01-20]"
    kind: supported_pids
    bytes: 4
    verification: verified

  - pid: 0x01
    signal_id: monitor_status
    name: "Monitor status since DTCs cleared"
    kind: bitfield
    bytes: 4
    verification: verified
    # SAE J1979 readiness monitors.
    #
    # This is the most useful PID on the bus for someone buying a used car, and
    # it is why it is decoded in full rather than just for the warning lamp.
    # After the trouble codes are cleared, every monitor resets to "not
    # complete" and only finishes again once the car has been driven through the
    # right conditions - typically 50-100 miles of mixed driving.
    #
    # So a car presented for sale with no stored codes but incomplete monitors
    # has very likely had its codes cleared shortly before you arrived. That is
    # not proof of dishonesty, but it is a fact worth knowing, and no amount of
    # looking at the dashboard reveals it.
    #
    # Byte B bit 3 says which engine type the vehicle is, which decides whether
    # bytes C and D carry the spark-ignition set or the compression-ignition
    # (diesel) set. Both are decoded; the consumer picks by that flag.
    flags:
      - { id: mil_on, label: "Malfunction indicator lamp on", byte: 0, bit: 7 }

      # Byte B: continuous monitors. "supported" says the vehicle has it at all.
      - { id: misfire_supported,   label: "Misfire monitoring supported", byte: 1, bit: 0 }
      - { id: fuel_supported,      label: "Fuel system monitoring supported", byte: 1, bit: 1 }
      - { id: component_supported, label: "Comprehensive component monitoring supported", byte: 1, bit: 2 }
      - { id: compression_ignition, label: "Compression ignition (diesel)", byte: 1, bit: 3 }
      # Note the polarity: the bit is SET when the monitor has NOT finished.
      - { id: misfire_incomplete,   label: "Misfire monitoring incomplete", byte: 1, bit: 4 }
      - { id: fuel_incomplete,      label: "Fuel system monitoring incomplete", byte: 1, bit: 5 }
      - { id: component_incomplete, label: "Comprehensive component monitoring incomplete", byte: 1, bit: 6 }

      # Byte C: non-continuous monitors supported (spark ignition naming).
      - { id: catalyst_supported,        label: "Catalyst monitoring supported", byte: 2, bit: 0 }
      - { id: heated_catalyst_supported, label: "Heated catalyst monitoring supported", byte: 2, bit: 1 }
      - { id: evap_supported,            label: "Evaporative system monitoring supported", byte: 2, bit: 2 }
      - { id: secondary_air_supported,   label: "Secondary air system monitoring supported", byte: 2, bit: 3 }
      - { id: ac_refrigerant_supported,  label: "A/C refrigerant monitoring supported", byte: 2, bit: 4 }
      - { id: o2_sensor_supported,       label: "Oxygen sensor monitoring supported", byte: 2, bit: 5 }
      - { id: o2_heater_supported,       label: "Oxygen sensor heater monitoring supported", byte: 2, bit: 6 }
      - { id: egr_supported,             label: "EGR system monitoring supported", byte: 2, bit: 7 }

      # Byte D: the same monitors, set when NOT complete.
      - { id: catalyst_incomplete,        label: "Catalyst monitoring incomplete", byte: 3, bit: 0 }
      - { id: heated_catalyst_incomplete, label: "Heated catalyst monitoring incomplete", byte: 3, bit: 1 }
      - { id: evap_incomplete,            label: "Evaporative system monitoring incomplete", byte: 3, bit: 2 }
      - { id: secondary_air_incomplete,   label: "Secondary air system monitoring incomplete", byte: 3, bit: 3 }
      - { id: ac_refrigerant_incomplete,  label: "A/C refrigerant monitoring incomplete", byte: 3, bit: 4 }
      - { id: o2_sensor_incomplete,       label: "Oxygen sensor monitoring incomplete", byte: 3, bit: 5 }
      - { id: o2_heater_incomplete,       label: "Oxygen sensor heater monitoring incomplete", byte: 3, bit: 6 }
      - { id: egr_incomplete,             label: "EGR system monitoring incomplete", byte: 3, bit: 7 }
    derived:
      - signal_id: dtc_count
        name: "Confirmed DTC count"
        formula: "A % 128"
        unit: null
        range: { min: 0, max: 127 }

  - pid: 0x03
    signal_id: fuel_system_status
    name: "Fuel system status"
    kind: enum
    bytes: 2
    verification: verified
    enum_byte: 0
    values:
