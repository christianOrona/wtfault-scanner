      7: "EOBD and OBD-II"
      8: "EOBD and OBD"
      9: "EOBD, OBD and OBD-II"
      10: "JOBD"
      11: "JOBD and OBD-II"
      12: "JOBD and EOBD"
      13: "JOBD, EOBD and OBD-II"

  - pid: 0x1F
    signal_id: run_time_since_start
    name: "Run time since engine start"
    kind: numeric
    bytes: 2
    unit: "s"
    formula: "256 * A + B"
    range: { min: 0, max: 65535 }
    verification: verified

  - pid: 0x20
    signal_id: supported_pids_21_40
    name: "PIDs supported [21-40]"
    kind: supported_pids
