    range: { min: 0, max: 655.35 }
    verification: verified

  - pid: 0x11
    signal_id: throttle_position
    name: "Throttle position"
    kind: numeric
    bytes: 1
    unit: "%"
    formula: "A * 100 / 255"
    range: { min: 0, max: 100 }
    verification: verified

  # Narrowband oxygen sensors, the ones nearly every petrol engine from before
  # wideband sensors reports. Byte A is the sensor's output voltage, which
  # swings between about 0.1 V (lean) and 0.9 V (rich) on a working sensor in
  # closed loop; a sensor stuck at one end is the classic failure. Checked
  # against SAE J1979 as python-OBD implements it.
  #
  # Byte B is the short-term fuel trim this sensor feeds, with FF meaning it
  # feeds none. It is not decoded here: only one source for its scaling could
  # be checked, and a trim of +99 % shown for "not used" would be worse than
  # no trim at all.
  #
  # Bank and sensor follow the PID 0x13 layout, which most vehicles with these
  # PIDs use. A vehicle that reports PID 0x1D instead numbers its sensors
  # differently, and the names here would be wrong for it.
  - pid: 0x14
    signal_id: o2_b1s1_voltage
    name: "Oxygen sensor voltage, bank 1 sensor 1"
    kind: numeric
    bytes: 2
    unit: "V"
    formula: "A / 200"
    range: { min: 0, max: 1.275 }
    verification: verified

