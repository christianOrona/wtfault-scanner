  # ------------------------------------------------------------------
  # UNVERIFIED BELOW THIS LINE.
  #
  # These PID numbers are allocated by SAE J1979 for diesel aftertreatment
  # data, but this project has NOT validated the byte layouts or scaling
  # against the standard document or against a vehicle. They are present so
  # the diesel data path can be exercised end to end. Values decoded from
  # them are flagged untrustworthy and must never be used to make a claim.
  # ------------------------------------------------------------------

  - pid: 0x78
    signal_id: egt_bank1_sensor1
    name: "Exhaust gas temperature, bank 1 sensor 1 (UNVERIFIED)"
    kind: numeric
    bytes: 9
    unit: "degC"
    # Byte A is a sensor-support mask; the first sensor's 16-bit reading
    # follows it. Scaling assumed to match the catalyst-temperature form.
    formula: "(256 * B + C) / 10 - 40"
    range: { min: -40, max: 6513.5 }
    verification: unverified
    notes: >
      Byte layout and scaling not validated against SAE J1979. Do not present
      this value to a user as a measured exhaust temperature.

  - pid: 0x7C
    signal_id: dpf_temp_bank1_inlet
    name: "Diesel particulate filter temperature, bank 1 inlet (UNVERIFIED)"
    kind: numeric
    bytes: 9
    unit: "degC"
    formula: "(256 * B + C) / 10 - 40"
    range: { min: -40, max: 6513.5 }
    verification: unverified
    notes: >
      PID 0x7C is allocated for DPF temperature but this project has not
      validated its byte layout or scaling. Present only as raw evidence.

  # Readings a 2023 Honda Odyssey's engine lists (2026-10-04) that this build
  # did not decode. None was asked for in that session, so there are no
  # recorded bytes to hold these against: each is unverified until it is read
  # on a vehicle. Where it says two sources, the public PID table and
  # python-OBD's decoder agree on the layout.

  # Wide-range oxygen sensors. Bytes A-B are the air-fuel equivalence ratio
  # (lambda: 1.0 is the exact mixture, above it lean, below it rich) and C-D
  # the sensor's voltage. Two sources for the voltage; the lambda scaling is
  # the public PID table's alone. Which bank "sensor 5" is on depends on how
  # the engine numbers its sensors (PID 13 or 1D), which is not decoded.
  - pid: 0x24
    signal_id: o2_wide_s1_voltage
    name: "Wide-range oxygen sensor 1 voltage (UNVERIFIED)"
    kind: numeric
    bytes: 4
    unit: "V"
    formula: "(256 * C + D) * 8 / 65535"
    range: { min: 0, max: 8 }
    verification: unverified
    derived:
      - signal_id: o2_wide_s1_lambda
        name: "Wide-range oxygen sensor 1 air-fuel ratio, lambda (UNVERIFIED)"
        formula: "(256 * A + B) / 32768"
        unit: "lambda"
        range: { min: 0, max: 2 }

  - pid: 0x28
    signal_id: o2_wide_s5_voltage
    name: "Wide-range oxygen sensor 5 voltage (UNVERIFIED)"
    kind: numeric
    bytes: 4
    unit: "V"
    formula: "(256 * C + D) * 8 / 65535"
    range: { min: 0, max: 8 }
    verification: unverified
    derived:
      - signal_id: o2_wide_s5_lambda
        name: "Wide-range oxygen sensor 5 air-fuel ratio, lambda (UNVERIFIED)"
        formula: "(256 * A + B) / 32768"
        unit: "lambda"
        range: { min: 0, max: 2 }

  # Fuel tank vapour pressure: a signed sixteen-bit count of quarter pascals,
  # so the formula takes 65536 off when the top bit of A is set. Two sources.
  - pid: 0x32
    signal_id: evap_vapor_pressure
    name: "Evaporative system vapour pressure (UNVERIFIED)"
    kind: numeric
    bytes: 2
    unit: "Pa"
    formula: "(256 * A + B - 65536 * ((A - A % 128) / 128)) / 4"
    range: { min: -8192, max: 8191.75 }
    verification: unverified

  # The correction the sensor after the catalytic converter adds. Byte A is
  # the bank named; byte B, where a module sends one, is bank 3 or 4 and is
  # not decoded. Scaled as the fuel trims are. Two sources.
  - pid: 0x55
    signal_id: short_secondary_o2_trim_b1
    name: "Short term secondary oxygen sensor trim, bank 1 (UNVERIFIED)"
    kind: numeric
    bytes: 1
    unit: "%"
    formula: "A / 1.28 - 100"
    range: { min: -100, max: 99.2 }
    verification: unverified

  - pid: 0x56
    signal_id: long_secondary_o2_trim_b1
    name: "Long term secondary oxygen sensor trim, bank 1 (UNVERIFIED)"
    kind: numeric
    bytes: 1
    unit: "%"
    formula: "A / 1.28 - 100"
    range: { min: -100, max: 99.2 }
    verification: unverified

  - pid: 0x57
    signal_id: short_secondary_o2_trim_b2
    name: "Short term secondary oxygen sensor trim, bank 2 (UNVERIFIED)"
    kind: numeric
    bytes: 1
    unit: "%"
    formula: "A / 1.28 - 100"
    range: { min: -100, max: 99.2 }
    verification: unverified

  - pid: 0x58
    signal_id: long_secondary_o2_trim_b2
    name: "Long term secondary oxygen sensor trim, bank 2 (UNVERIFIED)"
    kind: numeric
    bytes: 1
    unit: "%"
    formula: "A / 1.28 - 100"
    range: { min: -100, max: 99.2 }
    verification: unverified

  # Scaled as the other torque PIDs are (61, 62). One source.
  - pid: 0x8E
    signal_id: engine_friction_torque
    name: "Engine friction, percent torque (UNVERIFIED)"
    kind: numeric
    bytes: 1
    unit: "%"
    formula: "A - 125"
    range: { min: -125, max: 130 }
    verification: unverified

  # Diesel exhaust fluid, from the two legislated PIDs that carry it. Both give
  # the tank level as one byte of 100/255 % (SAE J1979, as quoted in the public
  # PID tables). Measured on a 2019 F-250 diesel on 2026-09-28: 0x9B byte D and
  # 0x85 byte F both read 0x69, 41.2 %. Only the level is decoded; the other
  # bytes of both replies are left as raw evidence until their layout is known.
  - pid: 0x85
    signal_id: def_level_reagent_system
    name: "Diesel exhaust fluid level (NOx reagent system)"
    kind: numeric
    bytes: 10
    unit: "%"
    formula: "F * 100 / 255"
    range: { min: 0, max: 100 }
    verification: unverified

  - pid: 0x9B
    signal_id: def_level
    name: "Diesel exhaust fluid tank level"
    kind: numeric
    bytes: 4
    unit: "%"
    formula: "D * 100 / 255"
    range: { min: 0, max: 100 }
    verification: unverified

  # The newer forms of four readings every engine has. Measured on a 2023
  # Honda Odyssey on 2026-10-04: its engine controller lists 59 PIDs and
  # 0x05, 0x0F and 0x10 are not among them. Coolant temperature, intake air
  # temperature and air flow are reported only on 0x67, 0x68 and 0x66, so with
  # the older PIDs alone this vehicle has no coolant temperature at all.
  #
  # Each starts with a byte saying which sensors are fitted, then one value
  # per sensor. A sensor is decoded only when that byte says it is there:
  # the Odyssey's coolant reply was 03 7F 61, two sensors at 87 and 57 degC,
  # and its intake air reply 01 64 00 00 00 00 00, one sensor and placeholders.
  # Layouts are SAE J1979 as the public PID tables give them, from one source,
  # and stay unverified until read on a vehicle and checked against something
  # else that vehicle says.
  #
  # `stands_in_for` names the older signal each carries the same reading as.
  # Whatever asks for that one is given this instead on a module that lists
  # this PID and not the older one.
  - pid: 0x66
    signal_id: maf_sensor_a
    name: "Mass air flow, sensor A (UNVERIFIED)"
    kind: numeric
    bytes: 5
    unit: "g/s"
    formula: "(256 * B + C) / 32"
    range: { min: 0, max: 2047.97 }
    verification: unverified
    present_when: { byte: 0, bit: 0 }
    stands_in_for: maf_rate
    derived:
      - signal_id: maf_sensor_b
        name: "Mass air flow, sensor B (UNVERIFIED)"
        formula: "(256 * D + E) / 32"
        unit: "g/s"
        range: { min: 0, max: 2047.97 }
        present_when: { byte: 0, bit: 1 }

  - pid: 0x67
    signal_id: coolant_temp_sensor_1
    name: "Engine coolant temperature, sensor 1 (UNVERIFIED)"
    kind: numeric
    bytes: 3
    unit: "degC"
    formula: "B - 40"
    range: { min: -40, max: 215 }
    verification: unverified
    present_when: { byte: 0, bit: 0 }
    stands_in_for: coolant_temp
    derived:
      - signal_id: coolant_temp_sensor_2
        name: "Engine coolant temperature, sensor 2 (UNVERIFIED)"
        formula: "C - 40"
        unit: "degC"
        range: { min: -40, max: 215 }
        present_when: { byte: 0, bit: 1 }

  - pid: 0x68
    signal_id: intake_air_temp_sensor_1
    name: "Intake air temperature, bank 1 sensor 1 (UNVERIFIED)"
    kind: numeric
    bytes: 7
    unit: "degC"
    formula: "B - 40"
    range: { min: -40, max: 215 }
    verification: unverified
    present_when: { byte: 0, bit: 0 }
    stands_in_for: intake_air_temp

  # The odometer, as the engine controller reports it: four bytes, tenths of a
  # kilometre. The one reading here a person can check exactly, against the
  # dash.
  - pid: 0xA6
    signal_id: odometer
    name: "Odometer (UNVERIFIED)"
    kind: numeric
    bytes: 4
    unit: "km"
    formula: "(16777216 * A + 65536 * B + 256 * C + D) / 10"
    range: { min: 0, max: 429496729.5 }
    verification: unverified
