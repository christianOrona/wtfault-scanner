  # ------------------------------------------------------------------
  # UNVERIFIED BELOW THIS LINE.
  #
  # These PID numbers are allocated by SAE J1979 for diesel aftertreatment
  # data, but this project has NOT validated the byte layouts or scaling
  # against the standard document or against a vehicle. They are present so
  # the diesel data path can be exercised end to end. Values decoded from
  # them are flagged untrustworthy and must never be used to make a claim.
  # ------------------------------------------------------------------

  - pid: 0x78
    signal_id: egt_bank1_sensor1
    name: "Exhaust gas temperature, bank 1 sensor 1 (UNVERIFIED)"
    kind: numeric
    bytes: 9
    unit: "degC"
    # Byte A is a sensor-support mask; the first sensor's 16-bit reading
    # follows it. Scaling assumed to match the catalyst-temperature form.
    formula: "(256 * B + C) / 10 - 40"
    range: { min: -40, max: 6513.5 }
    verification: unverified
    notes: >
      Byte layout and scaling not validated against SAE J1979. Do not present
      this value to a user as a measured exhaust temperature.

  - pid: 0x7C
    signal_id: dpf_temp_bank1_inlet
    name: "Diesel particulate filter temperature, bank 1 inlet (UNVERIFIED)"
    kind: numeric
    bytes: 9
    unit: "degC"
    formula: "(256 * B + C) / 10 - 40"
    range: { min: -40, max: 6513.5 }
    verification: unverified
    notes: >
      PID 0x7C is allocated for DPF temperature but this project has not
      validated its byte layout or scaling. Present only as raw evidence.
