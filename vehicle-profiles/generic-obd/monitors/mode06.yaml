# SAE J1979 service 06 — on-board monitor test results.
#
# What makes this worth having: service 06 reports each self-test's *measured
# value against the limit it is judged by*. A catalyst reading 0.58 against a
# 0.60 limit has passed and is about to stop passing, and no trouble code will
# say so until it does. This is the difference between a scanner that tells you
# a part has failed and one that tells you it is failing.
#
# Two separate tables:
#
#   monitors — what each on-board monitor id (MID) tests. Only the SAE-defined
#              ids are listed. Manufacturers use 0xE1 and above for their own
#              monitors, and this project does not guess at those: an unlisted
#              MID is reported by its number, exactly as an unnamed module is
#              reported by its address.
#
#   units    — the unit-and-scaling id (UASID) table that turns the raw 16-bit
#              counts into physical values.
#
# IMPORTANT: every entry in `units` is marked unverified, because this project
# has not validated the scaling against a real vehicle. That is deliberate and
# it costs nothing, because the useful part of service 06 does not depend on it:
# the value, the lower limit and the upper limit all arrive in the same unit,
# so "did it pass" and "how close to failing" are exact whatever that unit is.
# The scaled number is shown as supporting evidence, clearly marked.

version: 1

monitors:
  # The ids are SAE J1979's, as python-OBD lists them, and as a 2023 Honda
  # Odyssey reported them on 2026-10-04: a petrol V6 with oxygen sensors at 01,
  # 02, 05 and 06, catalysts at 21 and 22, valve timing at 35 and 36, vapour
  # leak checks at 3A and 3C, purge flow at 3D, fuel system at 81 and 82, and
  # six cylinders of misfire data at A2 to A7.
  #
  # Until 0.7.1 this table was wrong from 39 upward. It called 3A valve timing,
  # 41 purge flow, 71 a NOx adsorber, 81 NOx aftertreatment and 86 a particulate
  # filter, so that Odyssey's fuel system tests were shown as diesel NOx tests.
  # Pass, fail and margin were never affected: they do not use the name.

  # Oxygen sensors: banks 1 to 4, four sensors each.
  - mid: 0x01
    name: "Oxygen sensor, bank 1 sensor 1"
    system: "Exhaust"
  - mid: 0x02
    name: "Oxygen sensor, bank 1 sensor 2"
    system: "Exhaust"
  - mid: 0x03
    name: "Oxygen sensor, bank 1 sensor 3"
    system: "Exhaust"
  - mid: 0x04
    name: "Oxygen sensor, bank 1 sensor 4"
    system: "Exhaust"
  - mid: 0x05
    name: "Oxygen sensor, bank 2 sensor 1"
    system: "Exhaust"
  - mid: 0x06
    name: "Oxygen sensor, bank 2 sensor 2"
    system: "Exhaust"
  - mid: 0x07
    name: "Oxygen sensor, bank 2 sensor 3"
    system: "Exhaust"
  - mid: 0x08
    name: "Oxygen sensor, bank 2 sensor 4"
    system: "Exhaust"
  - mid: 0x09
    name: "Oxygen sensor, bank 3 sensor 1"
    system: "Exhaust"
  - mid: 0x0A
    name: "Oxygen sensor, bank 3 sensor 2"
    system: "Exhaust"
  - mid: 0x0B
    name: "Oxygen sensor, bank 3 sensor 3"
    system: "Exhaust"
  - mid: 0x0C
    name: "Oxygen sensor, bank 3 sensor 4"
    system: "Exhaust"
  - mid: 0x0D
    name: "Oxygen sensor, bank 4 sensor 1"
    system: "Exhaust"
  - mid: 0x0E
    name: "Oxygen sensor, bank 4 sensor 2"
    system: "Exhaust"
  - mid: 0x0F
    name: "Oxygen sensor, bank 4 sensor 3"
    system: "Exhaust"
  - mid: 0x10
    name: "Oxygen sensor, bank 4 sensor 4"
    system: "Exhaust"

  # Catalytic converters.
  - mid: 0x21
    name: "Catalytic converter, bank 1"
    system: "Emissions"
  - mid: 0x22
    name: "Catalytic converter, bank 2"
    system: "Emissions"
  - mid: 0x23
    name: "Catalytic converter, bank 3"
    system: "Emissions"
  - mid: 0x24
    name: "Catalytic converter, bank 4"
    system: "Emissions"

  # Exhaust gas recirculation.
  - mid: 0x31
    name: "Exhaust gas recirculation, bank 1"
    system: "Emissions"
  - mid: 0x32
    name: "Exhaust gas recirculation, bank 2"
    system: "Emissions"
  - mid: 0x33
    name: "Exhaust gas recirculation, bank 3"
    system: "Emissions"
  - mid: 0x34
    name: "Exhaust gas recirculation, bank 4"
    system: "Emissions"

  # Variable valve timing.
  - mid: 0x35
    name: "Variable valve timing, bank 1"
    system: "Engine"
  - mid: 0x36
    name: "Variable valve timing, bank 2"
    system: "Engine"
  - mid: 0x37
    name: "Variable valve timing, bank 3"
    system: "Engine"
  - mid: 0x38
    name: "Variable valve timing, bank 4"
    system: "Engine"

  # Fuel vapour (evaporative emissions) leak checks, by the size of leak each
  # one looks for, then the purge flow check.
  - mid: 0x39
    name: "Fuel vapour leak check (filler cap off / 0.150 inch)"
    system: "Emissions"
  - mid: 0x3A
    name: "Fuel vapour leak check (0.090 inch)"
    system: "Emissions"
  - mid: 0x3B
    name: "Fuel vapour leak check (0.040 inch)"
    system: "Emissions"
  - mid: 0x3C
    name: "Fuel vapour leak check (0.020 inch)"
    system: "Emissions"
  - mid: 0x3D
    name: "Fuel vapour purge flow"
    system: "Emissions"

  # Oxygen sensor heaters: banks 1 to 4, four sensors each.
  - mid: 0x41
    name: "Oxygen sensor heater, bank 1 sensor 1"
    system: "Exhaust"
  - mid: 0x42
    name: "Oxygen sensor heater, bank 1 sensor 2"
    system: "Exhaust"
  - mid: 0x43
    name: "Oxygen sensor heater, bank 1 sensor 3"
    system: "Exhaust"
  - mid: 0x44
    name: "Oxygen sensor heater, bank 1 sensor 4"
    system: "Exhaust"
  - mid: 0x45
    name: "Oxygen sensor heater, bank 2 sensor 1"
    system: "Exhaust"
  - mid: 0x46
    name: "Oxygen sensor heater, bank 2 sensor 2"
    system: "Exhaust"
  - mid: 0x47
    name: "Oxygen sensor heater, bank 2 sensor 3"
    system: "Exhaust"
  - mid: 0x48
    name: "Oxygen sensor heater, bank 2 sensor 4"
    system: "Exhaust"
  - mid: 0x49
    name: "Oxygen sensor heater, bank 3 sensor 1"
    system: "Exhaust"
  - mid: 0x4A
    name: "Oxygen sensor heater, bank 3 sensor 2"
    system: "Exhaust"
  - mid: 0x4B
    name: "Oxygen sensor heater, bank 3 sensor 3"
    system: "Exhaust"
  - mid: 0x4C
    name: "Oxygen sensor heater, bank 3 sensor 4"
    system: "Exhaust"
  - mid: 0x4D
    name: "Oxygen sensor heater, bank 4 sensor 1"
    system: "Exhaust"
  - mid: 0x4E
    name: "Oxygen sensor heater, bank 4 sensor 2"
    system: "Exhaust"
  - mid: 0x4F
    name: "Oxygen sensor heater, bank 4 sensor 3"
    system: "Exhaust"
  - mid: 0x50
    name: "Oxygen sensor heater, bank 4 sensor 4"
    system: "Exhaust"

  # Heated catalytic converters.
  - mid: 0x61
    name: "Heated catalytic converter, bank 1"
    system: "Emissions"
  - mid: 0x62
    name: "Heated catalytic converter, bank 2"
    system: "Emissions"
  - mid: 0x63
    name: "Heated catalytic converter, bank 3"
    system: "Emissions"
  - mid: 0x64
    name: "Heated catalytic converter, bank 4"
    system: "Emissions"

  # Secondary air injection.
  - mid: 0x71
    name: "Secondary air injection 1"
    system: "Emissions"
  - mid: 0x72
    name: "Secondary air injection 2"
    system: "Emissions"
  - mid: 0x73
    name: "Secondary air injection 3"
    system: "Emissions"
  - mid: 0x74
    name: "Secondary air injection 4"
    system: "Emissions"

  # Fuel system: how far the fuelling has had to be corrected.
  - mid: 0x81
    name: "Fuel system, bank 1"
    system: "Engine"
  - mid: 0x82
    name: "Fuel system, bank 2"
    system: "Engine"
  - mid: 0x83
    name: "Fuel system, bank 3"
    system: "Engine"
  - mid: 0x84
    name: "Fuel system, bank 4"
    system: "Engine"

  # Boost pressure control (turbocharger or supercharger).
  - mid: 0x85
    name: "Boost pressure control, bank 1"
    system: "Engine"
  - mid: 0x86
    name: "Boost pressure control, bank 2"
    system: "Engine"

  # NOx aftertreatment.
  - mid: 0x90
    name: "NOx adsorber, bank 1"
    system: "Emissions (diesel)"
  - mid: 0x91
    name: "NOx adsorber, bank 2"
    system: "Emissions (diesel)"
  - mid: 0x98
    name: "NOx catalyst, bank 1"
    system: "Emissions (diesel)"
  - mid: 0x99
    name: "NOx catalyst, bank 2"
    system: "Emissions (diesel)"

  # Misfire counts.
  - mid: 0xA1
    name: "Misfire, general data"
    system: "Engine"
  - mid: 0xA2
    name: "Misfire, cylinder 1"
    system: "Engine"
  - mid: 0xA3
    name: "Misfire, cylinder 2"
    system: "Engine"
  - mid: 0xA4
    name: "Misfire, cylinder 3"
    system: "Engine"
  - mid: 0xA5
    name: "Misfire, cylinder 4"
    system: "Engine"
  - mid: 0xA6
    name: "Misfire, cylinder 5"
    system: "Engine"
  - mid: 0xA7
    name: "Misfire, cylinder 6"
    system: "Engine"
  - mid: 0xA8
    name: "Misfire, cylinder 7"
    system: "Engine"
  - mid: 0xA9
    name: "Misfire, cylinder 8"
    system: "Engine"
  - mid: 0xAA
    name: "Misfire, cylinder 9"
    system: "Engine"
  - mid: 0xAB
    name: "Misfire, cylinder 10"
    system: "Engine"
  - mid: 0xAC
    name: "Misfire, cylinder 11"
    system: "Engine"
  - mid: 0xAD
    name: "Misfire, cylinder 12"
    system: "Engine"

  # Particulate filters.
  - mid: 0xB0
    name: "Particulate filter, bank 1"
    system: "Emissions (diesel)"
  - mid: 0xB1
    name: "Particulate filter, bank 2"
    system: "Emissions (diesel)"

# Unit and scaling ids. `scale` multiplies the raw count; `offset` is added
# afterwards; `signed` reads the raw value as two's complement.
#
# All unverified: not validated against a real vehicle by this project.
units:
  - uasid: 0x01
    unit: null
    scale: 1.0
  - uasid: 0x02
    unit: null
    scale: 0.1
  - uasid: 0x03
    unit: null
    scale: 0.01
  - uasid: 0x04
    unit: null
    scale: 0.001
  - uasid: 0x05
    unit: null
    scale: 0.0000305
  - uasid: 0x06
    unit: null
    scale: 0.000305
  - uasid: 0x07
    unit: "rpm"
    scale: 0.25
  - uasid: 0x08
    unit: "km/h"
    scale: 0.01
  - uasid: 0x09
    unit: "km/h"
    scale: 1.0
  - uasid: 0x0A
    unit: "V"
    scale: 0.000122
  - uasid: 0x0B
    unit: "V"
    scale: 0.001
  - uasid: 0x0C
    unit: "V"
    scale: 0.01
  - uasid: 0x0D
    unit: "mA"
