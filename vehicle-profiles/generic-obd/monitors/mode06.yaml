    unit: null
    scale: 1.0
  - uasid: 0x02
    unit: null
    scale: 0.1
  - uasid: 0x03
    unit: null
    scale: 0.01
  - uasid: 0x04
    unit: null
    scale: 0.001
  - uasid: 0x05
    unit: null
    scale: 0.0000305
  - uasid: 0x06
    unit: null
    scale: 0.000305
  - uasid: 0x07
    unit: "rpm"
    scale: 0.25
  - uasid: 0x08
    unit: "km/h"
    scale: 0.01
