  - uasid: 0x17
    unit: "kPa"
    scale: 0.01
  - uasid: 0x18
    unit: "kPa"
    scale: 0.0117
  - uasid: 0x19
    unit: "kPa"
    scale: 0.079
  - uasid: 0x1A
    unit: "kPa"
    scale: 1.0
  - uasid: 0x1B
    unit: "kPa"
    scale: 10.0
  - uasid: 0x1C
    unit: "degrees"
    scale: 0.01
  - uasid: 0x1D
    unit: "degrees"
    scale: 0.5
  - uasid: 0x1E
    unit: "ratio"
    scale: 0.0000305
  - uasid: 0x1F
