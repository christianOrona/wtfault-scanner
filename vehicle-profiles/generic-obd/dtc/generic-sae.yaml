  P0236: { description: "Turbocharger/supercharger boost sensor A circuit range/performance", verification: verified }
  P0299: { description: "Turbocharger/supercharger underboost condition", verification: verified }
  P2262: { description: "Turbocharger boost pressure not detected, mechanical", verification: verified }
  P2263: { description: "Turbocharger/supercharger boost system performance", verification: verified }

  # --- misfire ---
  P0300: { description: "Random/multiple cylinder misfire detected", verification: verified }
  P0301: { description: "Cylinder 1 misfire detected", verification: verified }
  P0302: { description: "Cylinder 2 misfire detected", verification: verified }
