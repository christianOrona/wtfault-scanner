# Generic SAE J2012 diagnostic trouble code descriptions.
#
# Project-maintained subset of well-established generic codes. A code that is
# not listed here still decodes structurally (system letter, standard vs
# manufacturer-specific, subsystem group) but gets no description and is
# reported as unverified — the core never invents one.
version: 2
source: "SAE J2012 generic diagnostic trouble codes (project-maintained subset)"
codes:
  # --- fuel and air metering ---
  P0087: { description: "Fuel rail/system pressure too low", verification: verified }
  P0088: { description: "Fuel rail/system pressure too high", verification: verified }
  P0101: { description: "Mass or volume air flow circuit range/performance", verification: verified }
  P0102: { description: "Mass or volume air flow circuit low input", verification: verified }
  P0103: { description: "Mass or volume air flow circuit high input", verification: verified }
  P0106: { description: "Manifold absolute pressure/barometric pressure circuit range/performance", verification: verified }
  P0107: { description: "Manifold absolute pressure/barometric pressure circuit low input", verification: verified }
  P0108: { description: "Manifold absolute pressure/barometric pressure circuit high input", verification: verified }
  P0112: { description: "Intake air temperature sensor 1 circuit low", verification: verified }
  P0113: { description: "Intake air temperature sensor 1 circuit high", verification: verified }
  P0116: { description: "Engine coolant temperature circuit range/performance", verification: verified }
  P0117: { description: "Engine coolant temperature circuit low", verification: verified }
  P0118: { description: "Engine coolant temperature circuit high", verification: verified }
  P0121: { description: "Throttle/pedal position sensor A circuit range/performance", verification: verified }
  P0128: { description: "Coolant thermostat: coolant temperature below thermostat regulating temperature", verification: verified }
  P0131: { description: "Oxygen sensor circuit low voltage, bank 1 sensor 1", verification: verified }
  P0135: { description: "Oxygen sensor heater circuit, bank 1 sensor 1", verification: verified }
  P0171: { description: "System too lean, bank 1", verification: verified }
  P0172: { description: "System too rich, bank 1", verification: verified }
  P0174: { description: "System too lean, bank 2", verification: verified }
  P0175: { description: "System too rich, bank 2", verification: verified }
  P0180: { description: "Fuel temperature sensor A circuit", verification: verified }
  P0190: { description: "Fuel rail pressure sensor circuit", verification: verified }
  P0191: { description: "Fuel rail pressure sensor circuit range/performance", verification: verified }
  P0200: { description: "Injector circuit/open", verification: verified }
  P0201: { description: "Injector circuit/open, cylinder 1", verification: verified }
  P0202: { description: "Injector circuit/open, cylinder 2", verification: verified }
  P0203: { description: "Injector circuit/open, cylinder 3", verification: verified }
  P0204: { description: "Injector circuit/open, cylinder 4", verification: verified }
  P0205: { description: "Injector circuit/open, cylinder 5", verification: verified }
