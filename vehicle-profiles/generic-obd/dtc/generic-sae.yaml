  P2452: { description: "Diesel particulate filter pressure sensor A circuit", verification: verified }
  P2453: { description: "Diesel particulate filter pressure sensor A circuit range/performance", verification: verified }
  P2454: { description: "Diesel particulate filter pressure sensor A circuit low", verification: verified }
  P2455: { description: "Diesel particulate filter pressure sensor A circuit high", verification: verified }
  P2459: { description: "Diesel particulate filter regeneration frequency", verification: verified }
  P242F: { description: "Diesel particulate filter restriction, ash accumulation", verification: verified }
  P2463: { description: "Diesel particulate filter restriction, soot accumulation", verification: verified }
  P204F: { description: "Reductant system performance, bank 1", verification: verified }
  P20EE: { description: "SCR NOx catalyst efficiency below threshold, bank 1", verification: verified }

  # --- network ---
  U0100: { description: "Lost communication with ECM/PCM A", verification: verified }
  U0101: { description: "Lost communication with transmission control module", verification: verified }
  U0121: { description: "Lost communication with anti-lock brake system control module", verification: verified }
  U0140: { description: "Lost communication with body control module", verification: verified }
  U0155: { description: "Lost communication with instrument panel cluster control module", verification: verified }

# Structural fallbacks. Applied only when a code is absent from the table
# above; they describe the code's *shape*, never its meaning, and are always
# reported as unverified.
system_groups:
  P: "Powertrain"
  C: "Chassis"
  B: "Body"
  U: "Network / vehicle integration"
