  P0402: { description: "Exhaust gas recirculation flow excessive detected", verification: verified }
  P0403: { description: "Exhaust gas recirculation control circuit", verification: verified }
  P0404: { description: "Exhaust gas recirculation control circuit range/performance", verification: verified }
  P0420: { description: "Catalyst system efficiency below threshold, bank 1", verification: verified }
