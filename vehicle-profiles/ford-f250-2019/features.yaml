# Measured configuration mappings for one 2019 Ford F-250 Super Duty.
#
# WHAT THIS FILE IS.
#
# The first mapping in this project measured on a real vehicle. Every number
# below was observed changing on the truck itself: a baseline capture, the owner
# changing one setting with the vehicle's own menu, a second capture, and a diff
# reporting only the bits that moved. Then the same again in reverse.
#
# WHAT IT IS NOT.
#
# It is not a mapping for "a 2019 F-250". It is scoped by exact VIN, and that
# scoping is deliberate rather than cautious: a configuration record's layout can
# differ between trims and build dates of the same model year, and writing a
# neighbouring bit in a body module is how a body module stops working. Another
# truck of the same year may match and may not, and nothing here can tell the
# difference. Measure your own.
#
# HOW IT WAS MEASURED, so it can be checked or repeated:
#
#   Vehicle    2019 Ford F-250 Super Duty, VIN 1FT7W2BT7KEF78036
#   Adapter    ELM327 v1.5 USB cable at 500000 baud, HS-CAN
#   Protocol   ISO 15765-4 CAN, 11-bit, 500 kbit/s
#   Module     answers on 72E, listens on 726
#   Ranges     0xDE00-0xDEFF swept; 41 configuration records captured across
#              four body modules (723, 726, 736, 7D0)
#
#   Run 1  AutoLock ON  -> OFF   DE0E byte 4 bit 0: 1 -> 0
#   Run 2  AutoLock OFF -> ON    DE0E byte 4 bit 0: 0 -> 1
#
#   In both runs exactly one bit moved, in one module, and the other three
#   modules showed no change at all. The two runs were diffed with opposite
#   `after_is_on` values and independently agreed that 1 is the enabled state.

version: 1
profile: ford-f250-2019

features:
  - id: autolock_doors_when_driving
    name: "Lock the doors automatically when driving"
    risk: convenience

    easy: >-
      The truck locks its own doors once you start moving, and unlocks them
      again depending on how the rest of the door settings are configured. This
      is the same switch as the AutoLock entry in the door and lock menu on the
      dash - changing it here does exactly what changing it there does.

    technical: >-
      A single bit in a body module configuration record, read with ISO 14229
      service 0x22 and written whole with 0x2E after opening an extended
      diagnostic session. The module accepts writes in that session without a
      security access exchange, which was established separately by asking it to
      write to an identifier it had just reported as absent.

    modules: ["72E"]

    # An exact VIN. Applicability fails closed: a truck that is not this one
    # gets nothing, however similar it looks.
    applies_to:
      vins: ["1FT7W2BT7KEF78036"]

    # Evidence for reading: where the setting lives, and how that was learned.
    verification: verified
    source: >-
      measured on the vehicle by capture/diff, 2026-09-10: two toggles in
      opposite directions, one bit moved each time, three other body modules
      unchanged

    # Evidence for writing is a separate fact and this project does not conflate
    # them. Knowing which bit holds the setting is not knowing that writing it
    # works. This one has now been written, on this vehicle, and confirmed by
    # the owner reading the dash menu afterwards.
    #
    #   Adapter    OBDLink MX+ (STN2255 v5.12.4), Bluetooth
    #   Session    extended (0x10 0x03), no security access required
    #   Write      DE0E byte 4: 0x01 -> 0x00
    #   Read-back  immediately afterwards: 0x00, and again after the key cycle
    #   Confirmed  owner checked the dash menu: AutoLock reads off
    #
    # THE PART THAT NEARLY LOOKED LIKE A FAILURE, and the reason the note below
    # exists at all: immediately after the write the dash menu still said ON.
    # Every machine-checkable signal said the write had worked — the module
    # accepted it, the read-back showed the new value, nothing reverted — and
    # the vehicle still behaved as though nothing had changed. It took a key
    # cycle for the module to latch the new configuration.
    #
    # Without that written down, the next person does exactly what happened
    # here: writes the bit, checks the menu, sees no change, and concludes the
    # mapping is wrong. It is not wrong. It is deferred.
    write_verification:
      verification: verified
      verified_on_vehicles: 1
      source: >-
        written from this application on 2026-09-11 with an OBDLink MX+, read
        back, and confirmed against the dash menu by the vehicle's owner after
        a key cycle
      last_verified: "2026-09-11"
      notes: >-
        The change does not appear until the ignition has been cycled. Turn the
        key off, wait a few seconds, turn it back on, and then check - the
        module latches this configuration at power-up. Immediately after the
        write the menu will still show the old value, and that is expected
        rather than a sign the write failed.

    mapping:
      kind: data_identifier_bits
      module: "726"
      did: 0xDE0E
      byte: 4
      mask: 0x01
      on: 0x01
      off: 0x00

  # ---------------------------------------------------------------- mirrors
  #
  # TWO CANDIDATES, NOT MEASUREMENTS. Read the distinction before using them.
  #
  # Everything above this line was measured on this truck. These two were not.
  # They come from Ford owner-community documentation of the as-built blocks
  # that carry mirror fold-on-lock, cross-checked against this vehicle's own
  # factory as-built file — which does hold both blocks, at the values below.
  #
  # That cross-check is worth something and is not verification. It establishes
  # that the blocks exist on this truck and what the factory wrote in them. It
  # does not establish that the bit named here is the one that folds a mirror.
  #
  # So they are marked unverified, which in this application means: readable,
  # never writable. Reading one on the vehicle and finding 0xA0 where the file
  # says 0xA0 confirms the app is looking at the right record — no more.
  #
  # HOW TO TURN THESE INTO MEASUREMENTS, which is the only way they become
  # writable:
  #
  #   1. Capture DE02 from 740 and 741.
  #   2. Change fold-on-lock by some means that is not this application — the
  #      dash menu if this truck exposes it, or another tool.
  #   3. Capture again, and diff.
  #   4. If exactly one bit moved in each module, that is the mapping, and it
  #      replaces what is written here regardless of whether it agrees.
  #
  # Step 2 is the whole difficulty, and it is not a software problem.
  #
  # A NOTE ON THE SECOND BLOCK. The community recipe also names 740-12-01 and
  # 741-12-01, wanting a value beginning F. This vehicle's file holds a single
  # data byte of 0x00 in each, which that value does not fit — so either the
  # recipe is for a different build or the field is wider than it appears here.
  # It is deliberately NOT included below. A guessed write to a door module is
  # how a door module stops working.
  #
  # Both mirrors are separate modules and therefore separate entries. Folding
  # needs both; changing one leaves a truck that folds one mirror.

  - id: mirror_fold_on_lock_driver
    name: "Fold the driver's mirror when the truck is locked"
    risk: convenience

    easy: >-
      The driver's mirror pulls itself in when you lock the truck, and swings
      back out when you unlock it. The mirror motors and the switch on the door
      are already fitted to this truck; this is the setting that decides whether
      locking the doors uses them.

    technical: >-
      Driver door module as-built block 3, read with ISO 14229 service 0x22 at
      identifier 0xDE02. The bit below is the one owner-community documentation
      names for fold-on-lock. It has not been observed changing on this vehicle.

    modules: ["748"]

    applies_to:
      vins: ["1FT7W2BT7KEF78036"]

    # Unverified, and therefore readable but never writable. The source is
    # documentation written by people who are not this project, checked against
    # this vehicle's factory record but not against its behaviour.
    verification: unverified
    source: >-
      candidate from Ford owner-community documentation of as-built block
      740-03-01, cross-checked on 2026-09-12 against this vehicle's own
      Motorcraft as-built file, which holds 0xA0 0x00 in that block. Not
      measured on the vehicle and not written.

    mapping:
      kind: data_identifier_bits
      module: "740"
      did: 0xDE02
      byte: 0
      mask: 0x08
      on: 0x08
      off: 0x00

  - id: mirror_fold_on_lock_passenger
    name: "Fold the passenger mirror when the truck is locked"
    risk: convenience

    easy: >-
      The same setting for the passenger side. Both mirrors are controlled by
      their own door module, so both have to be set or the truck folds one
      mirror and leaves the other out.

    technical: >-
      Passenger door module as-built block 3, identifier 0xDE02, same bit as the
      driver side. Also a candidate rather than a measurement.

    modules: ["749"]

    applies_to:
      vins: ["1FT7W2BT7KEF78036"]

    verification: unverified
    source: >-
      candidate from Ford owner-community documentation of as-built block
      741-03-01, cross-checked on 2026-09-12 against this vehicle's own
      Motorcraft as-built file, which holds 0xA0 0x00 in that block. Not
      measured on the vehicle and not written.

    mapping:
      kind: data_identifier_bits
      module: "741"
      did: 0xDE02
      byte: 0
      mask: 0x08
      on: 0x08
      off: 0x00

  # The second half of the documented recipe: block 12 on each door module.
  #
  # The community notation is "740-12-01 Fxxx", where x means "leave as it is".
  # This vehicle holds a single 0x00 byte in that block, so the only reading of
  # that notation which fits is: set the high nibble to F, leave the low nibble.
  # That is 0x00 -> 0xF0, and it is an INFERENCE about notation, not a value
  # anybody has published for this block.
  #
  # It is recorded here so the inference is visible and arguable rather than
  # buried in whoever ran the experiment. At least one owner reportedly needed
  # 0xFC instead, which is the next hypothesis if this one produces nothing —
  # and a separate session, because two changes at once test neither.

  - id: mirror_fold_enable_driver
    name: "Driver door: mirror fold enable byte"
    risk: convenience

    easy: >-
      The second of two settings the mirror fold modification changes on the
      driver's door. On its own it does nothing visible; it is meant to be
      changed together with the other one.

    technical: >-
      Driver door module as-built block 12, identifier 0xDE0B, a single byte
      reading 0x00 from the factory. Target 0xF0 is an inference from the
      community notation "Fxxx" applied to a one-byte record.

    modules: ["748"]
    applies_to:
      vins: ["1FT7W2BT7KEF78036"]

    verification: unverified
    source: >-
      inferred from community notation for as-built block 740-12-01, not
      measured and not published as a byte value for this block

    mapping:
      kind: data_identifier_bits
      module: "740"
      did: 0xDE0B
      byte: 0
      mask: 0xF0
      on: 0xF0
      off: 0x00

  - id: mirror_fold_enable_passenger
    name: "Passenger door: mirror fold enable byte"
    risk: convenience

    easy: >-
      The same second setting on the passenger door. Both doors have to match
      or the truck is configured to fold one mirror.

    technical: >-
      Passenger door module as-built block 12, identifier 0xDE0B, same
      inference as the driver side.

    modules: ["749"]
    applies_to:
      vins: ["1FT7W2BT7KEF78036"]

    verification: unverified
    source: >-
      inferred from community notation for as-built block 741-12-01, not
      measured and not published as a byte value for this block

    mapping:
      kind: data_identifier_bits
      module: "741"
      did: 0xDE0B
      byte: 0
      mask: 0xF0
      on: 0xF0
      off: 0x00

  # ------------------------------------------------- double honk on exit
  #
  # MEASURED, and the first mapping in this project established by watching a
  # named setting move rather than by reading a forum.
  #
  #   Setting    "Double Honk On Leaving Cabine" in the body control module
  #   Run 1      Enabled -> Disabled, earlier the same day
  #   Run 2      Disabled -> Enabled, and confirmed by the owner hearing it
  #
  # The second run was a single-variable experiment: nothing else on the vehicle
  # was changed between the two backups, and exactly one line of one block moved.
  #
  #   726 block 41 line 2   00 00 01 01 01  ->  00 01 01 01 01
  #
  # Block 41 is identifier 0xDE28 (0xDE00 + 40), the same numbering that puts
  # AutoLock's block 15 at 0xDE0E. Line 1 of the block carries the first five
  # bytes, so line 2 byte 1 is byte 6 of the record.
  #
  # Reading is verified. WRITING from this application has not been done: the
  # change was made by another tool, and a module accepting a write from one
  # program is not evidence that it will accept one from another. The first
  # write here will be a first write, and is treated as one.

  - id: double_honk_on_leaving
    name: "Double horn chirp when you walk away"
    risk: cosmetic

    easy: >-
      The truck honks twice when you leave it locked with the engine running, or
      when it thinks you have walked away with the key. Turning this off stops
      the noise and changes nothing else about how the truck behaves.

    technical: >-
      Body control module as-built block 41, identifier 0xDE28, byte 6, bit 0.
      Measured by toggling the setting named "Double Honk On Leaving Cabine" and
      diffing whole-module as-built backups either side: exactly one line moved.

    modules: ["72E"]

    applies_to:
      vins: ["1FT7W2BT7KEF78036"]

    verification: verified
    source: >-
      measured on this vehicle 2026-09-12 by diffing body control module
      as-built backups across a single named change, Disabled to Enabled, with
      nothing else altered between them and the result confirmed audibly

    mapping:
      kind: data_identifier_bits
      module: "726"
      did: 0xDE28
      byte: 6
      mask: 0x01
      on: 0x01
      off: 0x00
